<h2>统计图用哪种形式？</h2>
<p class="subtitle">上传、下载两条数据；今日按小时，近7天/30天按天。</p>

<div class="cards">
  <div class="card" data-choice="line-bar" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">A · 今日折线 + 历史柱状</div>
        <div class="mockup-body">
          <div style="display:flex;align-items:flex-end;gap:6px;height:82px;margin-bottom:12px">
            <div style="flex:1;height:35px;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:58px;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:42px;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:70px;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:50px;background:#38BDF8;border-radius:4px 4px 0 0"></div>
          </div>
          <svg viewBox="0 0 220 50" width="100%" height="50">
            <polyline points="0,42 35,28 70,36 105,15 140,25 175,8 220,18" fill="none" stroke="#34D399" stroke-width="2.5"></polyline>
          </svg>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A · 今日折线 + 历史柱状</h3>
      <p>今日用双折线看趋势，历史用柱状图看每日对比。</p>
    </div>
  </div>

  <div class="card" data-choice="line" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">B · 全部折线</div>
        <div class="mockup-body">
          <svg viewBox="0 0 220 100" width="100%" height="100">
            <polyline points="0,74 20,56 40,62 60,34 80,48 100,20 120,38 140,16 160,32 180,12 220,24" fill="none" stroke="#38BDF8" stroke-width="2.5"></polyline>
            <polyline points="0,86 20,72 40,78 60,50 80,62 100,38 120,56 140,32 160,50 180,30 220,42" fill="none" stroke="#34D399" stroke-width="2.5"></polyline>
          </svg>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B · 全部折线</h3>
      <p>所有范围都用折线，强调趋势变化。</p>
    </div>
  </div>

  <div class="card" data-choice="bar" onclick="toggleSelect(this)">
    <div class="card-image">
      <div class="mockup">
        <div class="mockup-header">C · 全部柱状</div>
        <div class="mockup-body">
          <div style="display:flex;align-items:flex-end;gap:7px;height:100px">
            <div style="flex:1;height:34%;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:64%;background:#34D399;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:46%;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:72%;background:#34D399;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:54%;background:#38BDF8;border-radius:4px 4px 0 0"></div>
            <div style="flex:1;height:80%;background:#34D399;border-radius:4px 4px 0 0"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C · 全部柱状</h3>
      <p>所有范围都用柱状图，直观对比每个时间点。</p>
    </div>
  </div>
</div>
